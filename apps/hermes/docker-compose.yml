services:
  hermes:
    image: nousresearch/hermes-agent:v2026.7.20
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    environment:
      HERMES_DASHBOARD_PUBLIC_URL: https://wraeclast.bishop-bass.ts.net/hermes
    networks:
      - dokploy-network
    ports:
      - "8642:8642"   # gateway API
      - "9119:9119"   # dashboard (only reached when HERMES_DASHBOARD=1)
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hermes.rule=Host(`wraeclast.bishop-bass.ts.net`) && PathPrefix(`/hermes`)"
      - "traefik.http.routers.hermes.entrypoints=web,websecure"
      - "traefik.http.routers.hermes.tls=true"
      - "traefik.http.routers.hermes.tls.certresolver=tailscale"
      - "traefik.http.routers.hermes.tls.domains[0].main=wraeclast.bishop-bass.ts.net"
      - "traefik.http.routers.hermes.middlewares=hermes-prefix"
      - "traefik.http.middlewares.hermes-prefix.headers.customrequestheaders.X-Forwarded-Prefix=/hermes"
      - "traefik.http.services.hermes.loadbalancer.server.port=9119"
      - "traefik.http.routers.hermes-auth.rule=Host(`wraeclast.bishop-bass.ts.net`) && (PathPrefix(`/api`) || PathPrefix(`/auth`) || PathPrefix(`/login`) || PathPrefix(`/dashboard-plugins`))"
      - "traefik.http.routers.hermes-auth.entrypoints=web,websecure"
      - "traefik.http.routers.hermes-auth.tls=true"
      - "traefik.http.routers.hermes-auth.tls.certresolver=tailscale"
      - "traefik.http.routers.hermes-auth.tls.domains[0].main=wraeclast.bishop-bass.ts.net"
      - "traefik.http.routers.hermes-auth.middlewares=hermes-prefix"
      - "traefik.http.routers.hermes-auth.service=hermes"
    volumes:
      - hermes:/opt/data
    env_file:
      - path: .env
volumes:
  hermes:
    external: true
networks:
  dokploy-network:
    external: true