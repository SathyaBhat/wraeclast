services:
  hermes:
    image: nousresearch/hermes-agent:v2026.7.20
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    networks:
      - dokploy-network
    ports:
      - "8642:8642"   # gateway API
      - "9119:9119"   # dashboard (only reached when HERMES_DASHBOARD=1)
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hermes.rule=Host(`wraeclast.bishop-bass.ts.net`) && PathPrefix(`/hermes`)"
      - "traefik.http.routers.hermes.entrypoints=web,websecure"
      - "traefik.http.routers.hermes.tls=true"
      - "traefik.http.routers.hermes.tls.certresolver=tailscale"
      - "traefik.http.routers.hermes.tls.domains[0].main=wraeclast.bishop-bass.ts.net"
      - "traefik.http.routers.hermes.middlewares=hermes-prefix,hermes-strip-prefix"
      - "traefik.http.middlewares.hermes-prefix.headers.customrequestheaders.X-Forwarded-Prefix=/hermes"
      - "traefik.http.middlewares.hermes-strip-prefix.stripprefix.prefixes=/hermes"
      - "traefik.http.services.hermes.loadbalancer.server.port=9119"
    volumes:
      - hermes:/opt/data
    env_file:
      - path: .env
volumes:
  hermes:
    external: true
networks:
  dokploy-network:
    external: true