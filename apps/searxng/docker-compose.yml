name: searxng

services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./config:/etc/searxng
      - searxng-cache:/var/cache/searxng
    networks:
      - dokploy-network
      - searxng
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      # The instance is intentionally reachable only over the tailnet's
      # wraeclast hostname; it is not exposed on a public Internet domain.
      - "traefik.http.routers.searxng.rule=Host(`wraeclast.bishop-bass.ts.net`) && PathPrefix(`/searxng`)"
      - "traefik.http.routers.searxng.entrypoints=web,websecure"
      - "traefik.http.routers.searxng.tls=true"
      - "traefik.http.routers.searxng.tls.certresolver=tailscale"
      - "traefik.http.routers.searxng.tls.domains[0].main=wraeclast.bishop-bass.ts.net"
      - "traefik.http.routers.searxng.middlewares=searxng-strip"
      - "traefik.http.middlewares.searxng-strip.stripprefix.prefixes=/searxng"
      - "traefik.http.services.searxng.loadbalancer.server.port=8080"

  valkey:
    image: valkey/valkey:9-alpine
    container_name: searxng-valkey
    restart: unless-stopped
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - searxng-valkey:/data
    networks:
      - searxng

volumes:
  searxng-cache:
  searxng-valkey:

networks:
  searxng:
  dokploy-network:
    external: true
